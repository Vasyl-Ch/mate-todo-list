<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Todo list{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CDN (пример) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 30px; }
    .sidebar { width: 200px; }
    .content { margin-left: 220px; }
    .task-actions { float: right; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-auto sidebar">
        <div class="card">
          <div class="list-group list-group-flush">
            <a href="{% url 'tasks:home' %}" class="list-group-item list-group-item-action">Home</a>
            <a href="{% url 'tasks:tags' %}" class="list-group-item list-group-item-action">Tags</a>
          </div>
        </div>
      </nav>

      <!-- Content -->
      <main class="col content">
        <h1 class="display-5">{% block header %}Todo list{% endblock %}</h1>
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
